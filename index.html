<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Compound</title>
    <meta
      name="description"
      content="Daily routines, learning topics, habits, notes and lists."
    />
    <meta
      name="theme-color"
      content="#eef2ee"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f151b"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap"
    />
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background: #eef2ee;
        color: #5a6670;
        font:
          15px system-ui,
          sans-serif;
      }
      /* The logo's four growing dots (positions and sizes from favicon.svg, as % of its 512 box),
         popping in one after another, small to big, like a snowball. */
      .splash-mark {
        position: relative;
        width: 72px;
        height: 72px;
      }
      .splash-mark i {
        position: absolute;
        left: calc(var(--x) / 512 * 100%);
        top: calc(var(--y) / 512 * 100%);
        width: calc(var(--r) / 256 * 100%);
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--c);
        translate: -50% -50%;
        animation: splash-grow 1.8s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
        animation-delay: var(--d);
      }
      .splash-mark i:nth-child(1) { --x: 120; --y: 392; --r: 22; --c: #7b9bff; --d: 0s; }
      .splash-mark i:nth-child(2) { --x: 186; --y: 362; --r: 34; --c: #b28cff; --d: 0.15s; }
      .splash-mark i:nth-child(3) { --x: 270; --y: 306; --r: 52; --c: #f07aa5; --d: 0.3s; }
      .splash-mark i:nth-child(4) { --x: 370; --y: 200; --r: 78; --c: #e3b44f; --d: 0.45s; }
      .splash-over {
        background: color-mix(in srgb, #eef2ee 86%, transparent);
        backdrop-filter: blur(6px);
      }
      .splash[hidden] {
        display: none;
      }
      @keyframes splash-grow {
        0% { scale: 0; opacity: 0; }
        20% { scale: 1; opacity: 1; }
        70% { scale: 1; opacity: 1; }
        90%, 100% { scale: 0.6; opacity: 0; }
      }
      @media (prefers-color-scheme: dark) {
        .splash {
          background: #0f151b;
          color: #93a1ac;
        }
        .splash-over {
          background: color-mix(in srgb, #0f151b 86%, transparent);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-mark i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- Shown until React renders (it replaces #root's contents), and while an update installs. -->
    <div id="root">
      <div class="splash" role="status">
        <span class="splash-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span
        ><span class="splash-text">Loading…</span>
      </div>
    </div>
    <div
      id="updating"
      class="splash splash-over"
      role="status"
      aria-live="polite"
      hidden
    >
      <span class="splash-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span
      ><span class="splash-text">Updating the app…</span>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
